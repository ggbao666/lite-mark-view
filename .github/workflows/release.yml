name: Release

# 只有发版本才打包：推送 v* 标签自动构建并发布，日常 push / PR 不触发。
# 也可在 Actions 里手动运行，指定一个已存在的标签重新补传产物。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建到的版本标签（需已存在，如 v0.22.0）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # 先统一创建 Release，避免 Windows / macOS 两个构建任务同时 create 而冲突
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "value=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "ref=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "value=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "ref=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.ref }}
          fetch-depth: 0

      - name: Create release if missing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG 已存在，直接复用"
          else
            gh release create "$TAG" --title "LiteMark View $TAG" --generate-notes
          fi

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Build Windows x64
        run: wails build -platform windows/amd64 -clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiteMarkView-windows-amd64
          path: build/bin/LiteMarkView.exe
          if-no-files-found: error

      - name: Attach exe to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$env:TAG" build/bin/LiteMarkView.exe --clobber

  build-macos:
    needs: prepare
    runs-on: macos-14 # Apple Silicon (arm64) 原生构建，不产出 Intel / universal 包
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Build macOS Apple Silicon
        run: wails build -platform darwin/arm64 -clean

      - name: Package DMG
        run: |
          test -d build/bin/LiteMarkView.app
          hdiutil create -volname "LiteMark View" \
            -srcfolder build/bin/LiteMarkView.app \
            -ov -format UDZO build/bin/LiteMarkView-macOS-arm64.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiteMarkView-macos-arm64
          path: build/bin/LiteMarkView-macOS-arm64.dmg
          if-no-files-found: error

      - name: Attach dmg to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" build/bin/LiteMarkView-macOS-arm64.dmg --clobber
